<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rotation Skill</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page-container">
      <div class="controls">
        <button id="rotate-button" type="button">Rotate +11°</button>
        <button id="reset-button" class="reset-button" type="button">Reset</button>
      </div>

      <div id="page-rotator" class="page-rotator">
        <div class="content-card">
          <h1>Rotation Demo</h1>
          <p>This page rotates by 11° each time the rotate button is pressed.</p>
          <p>The reset button is outside the rotating area, so it stays immune to rotation.</p>
        </div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
